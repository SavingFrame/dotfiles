# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}
windowrule {
  name = windowrule-3
  float = on
  pin = on
  persistent_size = on
  no_initial_focus = on
  content = video
  move = ((monitor_w*0.81)) ((monitor_h*0.81))
  opacity = override 1.0 override 1.0 override 1.0
  match:class = zen
  match:title = Picture-in-Picture
}
windowrule {
  name = windowrule-4
  opacity = override 1.0 override 1.0 override 1.0
  match:class = zen
  match:title = .+Twitch.+
}

windowrule {
  name = windowrule-5
  opacity = override 1.0 override 1.0 override 1.0
  match:class = zen
  match:title = .+YouTube.+
}
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0.5
  match:namespace = swaync-control-center
}

layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0.5
  match:namespace = swaync-notification-window
}

# disable fade animation for vicinae only
layerrule {
  name = layerrule-3
  no_anim = on
  match:namespace = vicinae
}

windowrule {
	name = sinkswitch
	match:class = com.mitchellh.ghostty
	match:title = ghostty-sinkswitch
	float = on
	move = 3340 64
	size = 480 160
}
