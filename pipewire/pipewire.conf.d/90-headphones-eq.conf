 context.modules = [
       {
           name = libpipewire-module-filter-chain
           args = {
               node.description = "Headphones EQ"
               media.name = "Headphones EQ"

               filter.graph = {
                   nodes = [
                       {
                           type = builtin
                           name = eq
                           label = param_eq
                           config = {
                               filename = "/home/archie/.config/pipewire/eq/headphones.txt"
                           }
                       }
                   ]

                   inputs  = [ "eq:In 1"  "eq:In 2" ]
                   outputs = [ "eq:Out 1" "eq:Out 2" ]
               }

               capture.props = {
                   node.name = "headphones_eq"
                   media.class = "Audio/Sink"
                   audio.channels = 2
                   audio.position = [ FL FR ]
               }

               playback.props = {
                   node.name = "headphones_eq_output"
                   node.passive = true
                   audio.channels = 2
                   audio.position = [ FL FR ]
                   target.object = "alsa_output.usb-Apple__Inc._USB-C_to_3.5mm_Headphone_Jack_Adapter_DWH53560FCKL1MQA1-00.analog-stereo"
               }
           }
       }
   ]
