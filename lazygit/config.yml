git:
  # paging:
  #   colorArg: always
  #   pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  pagers:
    - externalDiffCommand: difft --color=always
gui:
  useHunkModeInStagingView: true
customCommands:
  # - key: <c-a>
  #   description: Pick AI commit (copy)
  #   command: aicommit2 -c && pbpaste > .git/LAZYGIT_PENDING_COMMIT
  #   context: files
  #   subprocess: true
  #   showOutput: true

  - key: <c-o>
    description: Pick AI commit (pi/openai fast)
    command: |
      pi -p --no-session --provider openai-codex --model gpt-5.3-codex --thinking off --no-tools --no-extensions --no-skills --no-prompt-templates "Generate 10 commit message options for the staged diff.

      Staged diff:
      BEGIN_DIFF
      $(git diff --cached)
      END_DIFF

      Branch: $(git branch --show-current)

      Requirements:
      - Use conventional commits format.
      - Each option must be a full commit message:
        <type>(<scope>): <subject>

        <body wrapped to ~72 chars>
      - Keep subject imperative and concise.
      - Focus on intent and impact, not only changed files.
      - Return ONLY valid JSON array with exactly 10 strings.
      - No markdown, no extra text." \
      | python3 -c "import json,sys;s=sys.stdin.read();i=s.find('[');j=s.rfind(']');a=json.loads(s[i:j+1]);print('\\0'.join(str(m).strip() for m in a if str(m).strip()), end='')" \
      | fzf --read0 --height 40% --border --ansi --preview "echo {}" --preview-window=up:wrap \
      > .git/LAZYGIT_PENDING_COMMIT
    context: files
    output: terminal
